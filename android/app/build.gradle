plugins {
    id "com.android.application"
}

android {
    namespace "io.github.salaretro"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.salaretro"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("salaretro.keystore")
            storePassword "salaretro"
            keyAlias "salaretro"
            keyPassword "salaretro"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
